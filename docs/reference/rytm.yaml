    midi_slot: 8
    midi_cc: 23
    midi_nrpn: [1, 7]
    bridge_param: bal
  - pos: 4
    key: DEC2
    name: "Osc 2 Decay"
    desc: "Decay time of oscillator 2's level."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 3
    midi_cc: 18
    midi_nrpn: [1, 2]
    bridge_param: dec2
  - pos: 5
    key: WAV1
    name: "Osc 1 Wave"
    range:
      min: 0
      max: 6
      enum: [sine, asym sine, triangle, sinesaw, asym saw, saw, ring-mod]
      note: enum index 0..6
      display: "sine, asym sine, triangle, sinesaw, asym saw, saw, ring-mod"
      source: manual
    desc: "Osc 1 waveform (7 options; ring-mod = osc1 ring-modulates osc2 with a square wave)."
    midi_slot: 6
    midi_cc: 21
    midi_nrpn: [1, 5]
    bridge_param:
