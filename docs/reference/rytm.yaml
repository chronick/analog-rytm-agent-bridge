# ===========================================================================
# LEGALITY — which MACHINES each drum track can host. Built from section 8.2
# "MACHINES" (manual p.21, the numbered per-track list) cross-checked against
# the APPENDIX D per-section track headers. General machines (DISABLE, UT NOISE,
# UT IMPULSE) are legal on ALL tracks (APPENDIX D.1) and are listed via
# `general_machines_on_all_tracks` rather than repeated per track.
#
# KEY ASYMMETRY: the BD/SD synthesis machines flow DOWN to the RS and CP tracks
# (RS/CP can host all BD/SD/SY machines), but the RS/CP-specific machines
# (RS HARD, RS CLASSIC, CP CLASSIC) do NOT flow UP to BD/SD (they are legal on
# RS and CP only, per APPENDIX D.4/D.5 "can only be used on the RS and CP
# tracks"). So BD and SD share one machine set; RS and CP share a larger one.
# ===========================================================================
legality:
  general_machines_on_all_tracks: [disable, ut-noise, ut-impulse]
  tracks:
    BD:
      name: "Bass Drum"
      machines: [bd-hard, bd-classic, bd-fm, bd-plastic, bd-silky, bd-sharp, bd-acoustic, sd-hard, sd-classic, sd-fm, sd-natural, sd-acoustic, sy-dual-vco, sy-chip, sy-raw]
      note: "BD machines + all SD machines + SY machines. Does NOT include RS/CP machines."
    SD:
      name: "Snare Drum"
      machines: [sd-hard, sd-classic, sd-fm, sd-natural, sd-acoustic, bd-hard, bd-classic, bd-fm, bd-plastic, bd-silky, bd-sharp, bd-acoustic, sy-dual-vco, sy-chip, sy-raw]
      note: "SD machines + all BD machines + SY machines. Same set as BD. Does NOT include RS/CP machines."
    RS:
      name: "Rim Shot"
      machines: [rs-hard, rs-classic, bd-hard, bd-classic, bd-fm, bd-plastic, bd-silky, bd-sharp, bd-acoustic, sd-hard, sd-classic, sd-fm, sd-natural, sd-acoustic, cp-classic, sy-dual-vco, sy-chip, sy-raw]
      note: "RS machines + all BD, SD and CP machines + SY machines."
    CP:
      name: "Hand Clap"
      machines: [cp-classic, bd-hard, bd-classic, bd-fm, bd-plastic, bd-silky, bd-sharp, bd-acoustic, sd-hard, sd-classic, sd-fm, sd-natural, sd-acoustic, rs-hard, rs-classic, sy-dual-vco, sy-chip, sy-raw]
      note: "CP machine + all BD, SD and RS machines + SY machines. Same set as RS."
    BT:
      name: "Bass Tom"
      machines: [bt-classic]
      note: "BT CLASSIC only."
    LT:
      name: "Low Tom"
      machines: [xt-classic]
      note: "XT CLASSIC (the shared tom machine)."
    MT:
      name: "Mid Tom"
      machines: [xt-classic]
      note: "XT CLASSIC (the shared tom machine)."
    HT:
      name: "High Tom"
      machines: [xt-classic]
      note: "XT CLASSIC (the shared tom machine)."
    CH:
      name: "Closed Hihat"
      machines: [ch-classic, ch-metallic, hh-basic, hh-lab, oh-classic, oh-metallic]
      note: "CH machines + HH BASIC/LAB + all OH machines."
    OH:
      name: "Open Hihat"
      machines: [oh-classic, oh-metallic, hh-basic, hh-lab, ch-classic, ch-metallic]
      note: "OH machines + HH BASIC/LAB + all CH machines. Same set as CH."
    CY:
      name: "Cymbal"
      machines: [cy-classic, cy-metallic, cy-ride, cb-classic, cb-metallic]
      note: "CY machines + all CB machines."
    CB:
      name: "Cow Bell"
      machines: [cb-classic, cb-metallic, cy-classic, cy-metallic, cy-ride]
      note: "CB machines + all CY machines. Same set as CY."

# ===========================================================================
# FX TRACK — the five FX-track PARAMETER pages (APPENDIX B). Delay and Reverb
# are SEND effects (fed by each drum track's AMP-page DEL/REV sends);
# Distortion and Compressor are MASTER effects (condition the whole mix); the
# FX LFO is a dedicated LFO whose parameters mirror the drum-track LFO.
# ===========================================================================
fx_track:
  pages:

    DELAY:
      manual_ref: "APPENDIX B.1 (p.81)"
      type: send
      name: "Delay"
      desc: "Send delay: a duplicated, time-delayed copy of the signal rejoined with the original."
      midi_ref: "APPENDIX C.7 DELAY (p.87). Addressed on the FX-track MIDI channel; nrpn MSB 2."
      parameters:
      - {pos: 1, key: TIM, name: "Delay Time", cc: 16, nrpn: [2, 0], desc: "Delay time relative to BPM, measured in 128th notes (e.g. 32 = one beat / four 16ths)."}
      - pos: 2
        key: X
        name: "Pingpong"
        range:
          min: 0
          max: 1
          enum: ['off', 'on']
          note: 0=off, 1=on
          display: "0 (off), 1 (on)"
          source: manual
        cc: 17
        nrpn: [2, 1]
        desc: "0 = manual pan via WID; 1 = signal alternates left/right (WID sets the pan amount)."
      - {pos: 3, key: WID, name: "Stereo Width", cc: 18, nrpn: [2, 2], desc: "Delay-signal pan width across the stereo field (bipolar; midi.guide: centered)."}
      - {pos: 4, key: FDB, name: "Feedback", cc: 19, nrpn: [2, 3], desc: "Amount of delay output fed back to its input (high values give infinite/swelling delays — can get very loud)."}
      - {pos: 5, key: HPF, name: "HP Filter", cc: 20, nrpn: [2, 4], desc: "Delay highpass cutoff frequency."}
      - {pos: 6, key: LPF, name: "LP Filter", cc: 21, nrpn: [2, 5], desc: "Delay lowpass cutoff frequency."}
      - {pos: 7, key: REV, name: "Reverb Send", cc: 22, nrpn: [2, 6], desc: "Amount of delay output sent to the reverb."}
      - {pos: 8, key: VOL, name: "Mix Volume", cc: 23, nrpn: [2, 7], desc: "Delay output volume (routed pre/post distortion+compressor per the DEL setting on the DISTORTION page)."}

    REVERB:
      manual_ref: "APPENDIX B.2 (p.81-82)"
      type: send
      name: "Reverb"
      desc: "Send reverb: simulates spaces from large halls to small confinements, with shelving damping and HP/LP filtering."
      midi_ref: "APPENDIX C.7 REVERB (p.87). FX-track channel; nrpn MSB 2."
      parameters:
      - {pos: 1, key: PRE, name: "Pre-delay", cc: 24, nrpn: [2, 8], desc: "Reverb pre-delay time."}
      - {pos: 2, key: DEC, name: "Decay", cc: 25, nrpn: [2, 9], desc: "Decay length of the reverberated signal (the size of the acoustic space)."}
      - {pos: 3, key: FRQ, name: "Shelving Frequency", cc: 26, nrpn: [2, 10], desc: "Shelving-filter frequency; with GAI, damps the reverb tail above this frequency."}
      - {pos: 4, key: GAI, name: "Shelving Gain", cc: 27, nrpn: [2, 11], desc: "Damping of the reverb tail above the shelving frequency (max = full treble; lower = gradually damped)."}
      - {pos: 5, key: HPF, name: "HP Filter", cc: 28, nrpn: [2, 12], desc: "Reverb highpass cutoff frequency."}
      - {pos: 6, key: LPF, name: "LP Filter", cc: 29, nrpn: [2, 13], desc: "Reverb lowpass cutoff frequency."}
      - {pos: 7, key: VOL, name: "Mix Volume", cc: 31, nrpn: [2, 15], desc: "Reverb output volume (routed pre/post distortion+compressor per the REV setting on the DISTORTION page)."}
      note: "The Reverb page exposes 7 parameters; the unused eighth knob slot corresponds to the skipped MIDI address cc 30 / nrpn [2, 14] (both manual C.7 and midi.guide skip it)."

    DISTORTION:
      manual_ref: "APPENDIX B.3 (p.82)"
      type: master
      name: "Distortion"
      desc: >-
        Master distortion: pronounces and distorts signal peaks, with a DC
        offset for asymmetric distortion. Also hosts the delay overdrive and the
        pre/post routing of the delay and reverb effect returns.
      midi_ref: "APPENDIX C.7 DISTORTION (p.87). FX-track channel; nrpn MSB 2."
      parameters:
      - {pos: 1, key: AMT, name: "Distortion Amount", cc: 70, nrpn: [2, 16], desc: "Amount of distortion applied."}
      - {pos: 2, key: SYM, name: "Distortion Symmetry", cc: 71, nrpn: [2, 17], desc: "Offsets the whole signal up/down before distortion, fringing only the crests or troughs (asymmetric distortion)."}
      - {pos: 3, key: DOV, name: "Delay Overdrive", cc: 72, nrpn: [2, 18], desc: "Overdrive of the Delay effect for a warm dynamic distortion (pair with the DELAY-page FDB)."}
      - pos: 4
        key: DEL
        name: "Delay Dist/Comp"
        range:
          min: 0
          max: 1
          enum: [PRE, POST]
          note: 0=PRE, 1=POST
          display: "PRE, POST"
          source: manual
        cc: 76
        nrpn: [2, 22]
        desc: "Whether the Delay return is before (PRE, default) or after (POST) distortion + compression."
      - pos: 5
        key: REV
        name: "Reverb Dist/Comp"
        range:
          min: 0
          max: 1
          enum: [PRE, POST]
          note: 0=PRE, 1=POST
          display: "PRE, POST"
          source: manual
        cc: 77
        nrpn: [2, 23]
        desc: "Whether the Reverb return is before (PRE) or after (POST, default) distortion + compression."
      note: "The Distortion page exposes 5 parameters. Note the MIDI gap: DOV (cc 72 / nrpn [2, 18]) jumps to DEL (cc 76 / nrpn [2, 22]); cc 73-75 / nrpn [2, 19..21] are unused knob slots (both manual C.7 and midi.guide)."

    COMPRESSOR:
      manual_ref: "APPENDIX B.4 (p.82-83)"
      type: master
      name: "Compressor"
      desc: "Master compressor across the whole mix, with sidechain EQ and dry/wet parallel-compression mix."
      midi_ref: "APPENDIX C.7 COMPRESSOR (p.87). FX-track channel; nrpn MSB 2."
      parameters:
      - {pos: 1, key: THR, name: "Threshold", cc: 78, nrpn: [2, 24], desc: "Compressor threshold (lower = more of the signal compressed)."}
      - pos: 2
        key: ATK
        name: "Attack"
        range:
          min: 0.03
          max: 30
          unit: ms
          display: "0.03-30 ms"
          source: manual
          cc_min: 0
          cc_max: 6
        cc: 79
        nrpn: [2, 25]
        desc: "Attack time — how quickly the compressor responds to loud peaks. midi.guide: cc range 0-6."
      - pos: 3
        key: REL
        name: "Release"
        range:
          min: 0.1
          max: 2
          unit: s
          enum: [A1, A2]
          note: A1/A2 = auto-release modes beyond the 2 s numeric max
          display: "0.1-2 s, A1, A2"
          source: manual
          cc_min: 0
          cc_max: 7
        cc: 80
        nrpn: [2, 26]
        desc: "Release time; A1/A2 are auto-release modes (A2 slightly longer than A1). midi.guide: cc range 0-7."
      - {pos: 4, key: MUP, name: "Makeup Gain", cc: 81, nrpn: [2, 27], desc: "Makeup gain to compensate for compression-reduced levels."}
      - pos: 5
        key: RAT
        name: "Compression Ratio"
        range:
          enum: ['1:2', '1:4', '1:8', MAX]
          display: "1:2, 1:4, 1:8, MAX"
          source: manual
          cc_min: 0
          cc_max: 3
        cc: 82
        nrpn: [2, 28]
        desc: "Compression ratio (higher = more compression). midi.guide: cc range 0-3."
      - pos: 6
        key: SEQ
        name: "Sidechain EQ"
        range:
          min: 0
          max: 3
          enum: ['OFF', LPF, HPF, HIT]
          note: enum index 0..3
          display: "OFF, LPF, HPF, HIT"
          source: manual
          cc_min: 0
          cc_max: 3
        cc: 83
        nrpn: [2, 29]
        desc: "Filters the detector signal: OFF unchanged, LPF reacts to bass (pumping), HPF reacts less to bass (avoids pumping), HIT balanced across frequencies. midi.guide: cc range 0-3."
      - pos: 7
        key: MIX
        name: "Dry/Wet Mix"
        range:
          min: 0
          max: 127
          display: "0-127"
          source: manual
        cc: 84
        nrpn: [2, 30]
        desc: "Blend of uncompressed and compressed signal (parallel compression); left = dry, right = fully compressed."
      - {pos: 8, key: VOL, name: "Volume", cc: 85, nrpn: [2, 31], desc: "Output signal volume."}

    LFO:
      manual_ref: "APPENDIX B.5 (p.83-84)"
      type: modulation
      name: "FX Track LFO"
      desc: >-
        Dedicated FX-track LFO; can modulate any parameter on the FX-track
        pages. Parameters mirror the drum-track LFO exactly (same waveforms and
        trig modes as track_pages.LFO).
      midi_ref: >-
        Appendix C documents ONE LFO CC/NRPN map (C.6, cc 102-109 / nrpn MSB 1);
        the FX-track LFO is addressed with the SAME numbers on the FX-track's MIDI
        channel (there is no separate FX-LFO table). See uncertainties.midi-fx-lfo-map-shared.
      # WARNING for consumers: unlike every OTHER FX-track page (which uses
      # NRPN MSB 2), the FX LFO uses NRPN MSB 1 — the shared C.6 LFO map — on
      # the FX channel. Do NOT iterate "FX channel => nrpn MSB 2" or you will
      # mis-address these eight params (uncertainties.midi-fx-lfo-map-shared).
      parameters:
      - {pos: 1, key: SPD, name: "Speed", cc: 102, nrpn: [1, 32], desc: "LFO speed (bipolar; negative runs the cycle backward). Try 8/16/32 for beat-synced motion."}
      - {pos: 2, key: MUL, name: "Multiplier", cc: 103, nrpn: [1, 33], desc: "Multiplies SPD. 24 settings: 12 tempo-synced (x) + 12 free (dot, sync to 120 BPM)."}
      - {pos: 3, key: FAD, name: "Fade In/Out", cc: 104, nrpn: [1, 34], desc: "Fades the modulation in/out (bipolar; positive = fade-out, negative = fade-in, 0 = none)."}
      - {pos: 4, key: DST, name: "Destination", cc: 105, nrpn: [1, 35], desc: "Modulation target — any parameter on the FX-track pages (selected from a live list, confirmed with [YES])."}
      - pos: 5
        key: WAV
        name: "Waveform"
        range:
          min: 0
          max: 6
          enum: [TRI, SINE, SQR, SAW, EXP, RMP, RND]
          note: 'enum index 0..6; on-screen labels. Bridge serde casing: Tri,Sin,Sqr,Saw,Exp,Rmp,Rnd'
          display: "TRI, SINE, SQR, SAW, EXP, RMP, RND"
          source: manual
        cc: 106
        nrpn: [1, 36]
        desc: "LFO waveform (same set as the drum-track LFO)."
      - pos: 6
        key: SPH
        name: "Start Phase"
        range:
          min: 0
          max: 127
          display: "0-127"
          source: manual
        cc: 107
        nrpn: [1, 37]
        desc: "Cycle start position when trigged (0 = start, 64 = center, 127 = end). With WAV=RND, adds slew instead."
      - pos: 7
        key: MOD
        name: "Trig Mode"
        range:
          min: 0
          max: 4
          enum: [FREE, TRIG, HOLD, ONE, HALF]
          note: 'enum index 0..4; bridge serde casing: Free,Trig,Hold,One,Half'
          display: "FREE, TRIG, HOLD, ONE, HALF"
          source: manual
        cc: 108
        nrpn: [1, 38]
        desc: "How the LFO responds to a trig (same modes as the drum-track LFO)."
      - {pos: 8, key: DEP, name: "Depth", cc: 109, cc_lsb: 118, nrpn: [1, 39], desc: "Modulation depth and polarity (bipolar; 0 = none). HIGH-RESOLUTION: cc MSB 109 + cc LSB 118."}

# ===========================================================================
# UNCERTAINTIES & FLAGGED INCONSISTENCIES
# Table extraction from the PDF was imperfect (the parameter-page layout images
# did not survive as text). Everything below is cross-checked against the
# surrounding prose; items are flagged rather than silently resolved.
# ===========================================================================
uncertainties:
- id: knob-positions-not-explicit
  where: "all machines + track_pages + fx_track"
  issue: >-
    The manual's explicit A-H knob labels live in parameter-page diagram
    images that did not extract to text. `pos` records each parameter's
    ordinal position in the manual's listing (which follows knob order A->H
    left to right). For pages/machines with all 8 parameters this equals
    knob A..H; for machines with fewer than 8 parameters the specific unused
    knob slots are not stated in the text.
  resolution: "Recorded ordinal position; did not assert speculative A-H letters."

- id: sd-acoustic-nol-label
  where: "machines[sd-acoustic].parameters NOL"
  issue: >-
    The manual prints 'NOL (Noise Balance) sets the level of the noise' — the
    parenthetical name ('Noise Balance') contradicts the description ('the
    level of the noise'). Elsewhere NOL is always 'Noise Level'.
  resolution: "Treated NOL as Noise Level (matches the description and the NOL key used on every other machine); flagged in the param desc."

- id: sy-dual-vco-duplicate-dec
  where: "machines[sy-dual-vco].parameters"
  issue: >-
    The manual labels TWO adjacent knobs 'DEC' — 'DEC (Osc 1 Decay)' and
    'DEC (Osc 2 Decay)'. Both share the key DEC in the text; on hardware they
    are two distinct knobs (likely shown as DEC1/DEC2 on the device).
  resolution: "Kept both as printed (key DEC) with distinct names Osc 1 Decay / Osc 2 Decay; flagged."

- id: sd-natural-dec-repurposed
  where: "machines[sd-natural].parameters DEC / BDY"
  issue: >-
    On SD NATURAL the manual assigns DEC to 'Noise Decay' and BDY to the
    oscillator 'Decay Time' — the opposite polarity of DEC vs BDY on
    SD ACOUSTIC (where NOD = noise decay and BDY = body decay). Internally
    consistent within the machine but the DEC key means something different
    here than on other machines.
  resolution: "Recorded as printed; flagged the per-machine meaning of DEC."

- id: disable-omitted-from-8.2-overview
  where: "legality vs section 8.2 overview"
  issue: >-
    Section 8.2's numbered per-track lists and its 'GENERAL MACHINES' line
    name only UT NOISE and UT IMPULSE as general/all-track machines and never
    mention DISABLE. APPENDIX D.1 ('ALL', p.96) explicitly lists DISABLE
    alongside UT NOISE / UT IMPULSE as usable on all 12 tracks.
  resolution: "Followed APPENDIX D.1 — DISABLE is legal on all tracks; recorded via general_machines_on_all_tracks. Flagged the section-8.2 omission."

- id: tom-machine-naming
  where: "machines[xt-classic] / legality LT,MT,HT"
  issue: >-
    Section 8.2 lists the LT/MT/HT machine as 'XT CLASSIC' and APPENDIX D.8
    confirms a single 'XT CLASSIC' machine shared by all three tom tracks.
    (Separately, the design doc rytm-build.yaml uses shorthand 'LT CLASSIC' /
    'MT CLASSIC' / 'HT CLASSIC' machine names that do NOT exist in the manual
    — the real machine is XT CLASSIC. This is a build-doc-vs-manual mismatch,
    not a manual-internal one.)
  resolution: "Used the manual's canonical 'XT CLASSIC'; noted the rytm-build.yaml shorthand for cross-reference."

- id: rs-cp-machine-flow-asymmetry
  where: "legality BD,SD,RS,CP"
  issue: >-
    APPENDIX D groups the BD (D.2) and SD (D.3) machines under 'can be used
    on the BD, SD, RS and CP tracks', but the RS/CP machines (D.4 RIMSHOT,
    D.5 HAND CLAP) under 'can only be used on the RS and CP tracks'. So
    BD/SD machines are legal on RS/CP, but RS/CP machines are NOT legal on
    BD/SD. This is consistent between 8.2 and APPENDIX D — recorded, not a
    contradiction, but easy to misread.
  resolution: "Encoded the asymmetry in legality.tracks and documented in the legality header."

  # --- MIDI (APPENDIX C) join ------------------------------------------------
- id: midi-appendixC-vs-appendixD-src
  where: "machines[*].parameters (pos) vs midi.machine_src_midi_order"
  issue: >-
    The manual's APPENDIX C.5 explicitly warns 'the order of the SYNTH
    parameters ... will sometimes differ from the order ... on the SRC page',
    and C.8 bears this out: the MIDI slot order per machine differs from the
    Appendix D SRC-page order, and for a few machines the NAMING differs too.
    Example: BD HARD in C.8 lists slot 6 as 'Sweep Depth' and slot 8 as
    'Transient Tick', whereas Appendix D (machines[bd-hard]) has a FIXED sweep
    depth and prints SNP 'Snap Amount' + TIC 'Tick Level' with a different
    ordering (pos: TUN,SWT,SNP,DEC,WAV,HLD,TIC,LEV). This is a MANUAL-INTERNAL
    Appendix-C-vs-Appendix-D mismatch, NOT a manual-vs-midi.guide one —
    midi.guide agrees with the C.8 MIDI ordering/naming.
  sources:
    manual_appendix_c: "APPENDIX C.8 (p.88-95) — MIDI order/naming"
    manual_appendix_d: "APPENDIX D (p.96-109) — SRC-page order/naming"
    midi_guide: "https://midi.guide/d/elektron/analog-rytm-mkii/ — agrees with C.8"
  resolution: >-
    Kept BOTH representations without conflating: machines[*].parameters keeps
    the Appendix D SRC-page params with on-screen `pos`; midi.machine_src_midi_order
    keeps the verbatim C.8 MIDI order for CC/NRPN lookup. Added NO per-machine
    `cc:` keys under machines to avoid asserting a false pos<->slot equivalence.

- id: midi-machine-type-count
  where: "midi.kit_parameters 'Track Machine Type' (cc 15) vs machines count"
  issue: >-
    midi.guide gives Track Machine Type (cc 15 / nrpn [1, 103]) a value range
    of 1-33 ('33 selectable machine types'), and the sound-design research doc
    likewise cites 33. This reference enumerates 34 machine entries under
    `machines:` (incl. DISABLE, counting the shared XT tom machine once). The
    manual's APPENDIX C does not state the machine-type count.
  sources:
    midi_guide: "cc 15 range 1-33 (33 types)"
    this_reference: "34 machine entries in machines:"
    manual: "APPENDIX C.3 gives no count"
  resolution: >-
    Recorded both. The 34-vs-33 gap is most plausibly DISABLE (a disable state,
    not an indexed selectable machine type) — but not asserting that; flagged
    for hardware confirmation. Kept all 34 machine entries.

  v2_resolution: |-
    v2: the pinned rytm-rs MachineType::try_from accepts exactly 34 machine
    strings (33 sound machines + disable) plus a non-selectable "unset"
    (bridge_interface.machine_type_strings). This corroborates the 34 machine
    entries here; midi.guide's "33 selectable" most plausibly excludes disable.
- id: midi-performance-cc38-skip
  where: "midi.performance_parameters"
  issue: >-
    The manual's APPENDIX C.4 lists Perf Param 3 = cc 37 and Perf Param 4 =
    cc 39, SKIPPING cc 38. midi.guide represents the twelve performance params
    as a contiguous 'cc 35-47' range, which hides the skipped 38.
  sources:
    manual_appendix_c: "cc 35,36,37,39,40,41,42,43,44,45,46,47 (38 skipped)"
    midi_guide: "cc 35-47 (contiguous notation)"
  resolution: "Recorded the manual's explicit per-param CCs (authoritative), with a note documenting midi.guide's compressed range."

- id: midi-hh-lab-nrpn-garbled
  where: "midi.machine_src_midi_order.hh-lab"
  issue: >-
    In the PDF->markdown extraction of APPENDIX C.8, the HH LAB NRPN LSB column
    came through garbled/duplicated (Tune 2/3/4 all show LSB 3, then 4, then 5).
    The CC column (16-23) extracted cleanly and sequentially.
  sources:
    manual_appendix_c_extraction: "NRPN LSB garbled (…,3,3,3,4,5)"
    midi_guide: "HH LAB = cc 16-23 mapped to nrpn [1, 0..7] (sequential)"
  resolution: >-
    Used midi.guide's clean sequential nrpn [1, 0..7], which also matches the
    APPENDIX C.5 generic synth-slot map (synth_param_slots). Flagged the
    extraction defect; the CC values are unaffected.

  v2_resolution: 'v2: rytm-rs exposes hh-lab as osc1..osc6/dec/lev at synth slots 2,4,5,6,7,8/3/1 -> cc 17,19,20,21,22,23/18/16, nrpn sequential [1,0..7]. Confirms the clean sequential map.'
- id: midi-sy-machines-nrpn-blank
  where: "midi.machine_src_midi_order.{sy-dual-vco,sy-chip,sy-raw}"
  issue: >-
    APPENDIX C.8 prints the SY DUAL VCO / SY CHIP / SY RAW machine tables with
    CC values (16-23) only and BLANK NRPN MSB/LSB columns. midi.guide likewise
    shows CC only for these machines.
  sources:
    manual_appendix_c: "SY machine tables: CC only, NRPN blank"
    manual_appendix_c5: "generic SYNTH map: Synth Param 1-8 = cc 16-23 = nrpn [1, 0..7]"
    midi_guide: "SY machines: CC only"
  resolution: >-
    Treated SY machines as nrpn [1, 0..7] per the C.5 generic map (the blank
    per-machine NRPN columns are an omission, not evidence NRPN is unsupported);
    noted the omission in machine_src_midi_order.notes. Both sources agree the
    CC tables are 16-23.

- id: midi-cowbell-pw-unmapped
  where: "machines[cb-classic|cb-metallic].parameters PW1, PW2"
  issue: >-
    The Appendix D SRC page for the cowbell machines exposes 6 params
    (TUN, DEC, DET, PW1 Pulse Width Osc1, PW2 Pulse Width Osc2, LEV), but the
    shared APPENDIX C.8 'CB CLASSIC & METALLIC' MIDI table lists only 4
    (Level, Tune, Decay Time, Detune). PW1 and PW2 therefore have no CC/NRPN.
  sources:
    manual_appendix_d: "6 SRC params incl. PW1/PW2"
    manual_appendix_c8: "4 MIDI params (no pulse-width)"
    midi_guide: "CB machines summarized as cc 16-23 -> nrpn [1, 0..7], but the detailed CB table also shows only Level/Tune/Decay/Detune"
  resolution: >-
    Recorded PW1/PW2 as MIDI-UNMAPPED (no cc/nrpn); documented in
    machine_src_midi_order.notes and left out of the cowbell slot order.

  v2_resolution: |-
    SUPERSEDED by v2. The pinned rytm-rs models cowbell PW1/PW2 at synth slots 5
    and 6 (cc 20/21, nrpn [1,4]/[1,5]) and the bridge sets them via bridge_param
    pw1/pw2. The Appendix C.8 "CB CLASSIC & METALLIC" table simply OMITS the two
    pulse-width params; the generic synth-slot map (synth_param_slots) still covers
    them. machines[cb-*].PW1/PW2 now carry midi_slot 5/6.
- id: midi-fx-lfo-map-shared
  where: "fx_track.pages.LFO midi_ref"
  issue: >-
    APPENDIX C documents a SINGLE LFO CC/NRPN table (C.6, cc 102-109 /
    nrpn MSB 1). Neither the manual nor midi.guide tabulates a SEPARATE FX-track
    LFO map, even though the FX track has its own dedicated LFO page.
  sources:
    manual_appendix_c6: "one LFO table (cc 102-109, nrpn [1, 32..39])"
    midi_guide: "one LFO table (same numbers)"
  resolution: >-
    Applied the C.6 LFO numbers to fx_track.pages.LFO, addressed on the FX
    track's own MIDI channel (same numbers, different channel — consistent with
    the whole per-track channel scheme). Flagged that Appendix C does not
    separately enumerate the FX LFO.

- id: midi-program-change-not-on-guide-fetch
  where: "midi.addressing.program_change"
  issue: >-
    The manual (section 8.6 p.22, and 14.4 CHANNELS/SYNC) clearly documents
    Program Change 0-127 -> pattern 1-128 (A01-H16). A WebFetch of the
    midi.guide page did not surface any Program Change mapping ('No Program
    Change mapping documented in this specification').
  sources:
    manual: "PC 0-127 -> pattern 1-128; section 8.6 + 14.4"
    midi_guide_fetch: "PC not surfaced (likely a page-scope/fetch artifact, not a contradiction)"
  resolution: "Used the manual (ground truth) for program change; treated the midi.guide gap as a fetch/scope artifact rather than a claimed absence."
- id: v2-midi-slot-c8-vs-rytmrs
  where: machines[*].parameters midi_slot vs midi.machine_src_midi_order
  issue: |-
    For many machines the DEVICE synth-param slot order (from rytm-rs f2e8143, the
    `machine_parameters` macro `#N` = synth_param_N) DIFFERS from the manual's
    Appendix C.8 machine_src_midi_order as extracted in v1 (39 param slots across
    ~13 machines: ut-noise, bd-hard, bd-plastic, bd-silky, bd-sharp, bd-acoustic,
    sd-acoustic, sy-dual-vco, sy-chip, sy-raw, cy-ride, ...). Example: bd-plastic
    C.8 lists slot 4 "Sweep Depth"/slot 8 "Dust Level", but the device has TYP at
    slot 4 and TIC at slot 8 (the C.8 bd-plastic row appears to be a silky-like
    mis-transcription). bd-hard slot 6 is "Sweep Depth" in C.8 but SNP (Snap) on the
    device (bd-hard sweep depth is fixed).
  sources:
    device: rytm-rs f2e8143 synth_param_N (from libanalogrytm-derived sysex layout; used by the bridge)
    manual_appendix_c8: machine_src_midi_order (PDF->md extraction, v1)
  resolution: |-
    midi_slot is set to the DEVICE synth-param slot (rytm-rs), which under the
    Elektron synth-param model equals cc (15+slot) / nrpn [1, slot-1]
    (midi.synth_param_slots) and is what the bridge writes. Where C.8 disagrees, the
    per-param midi_slot_c8_label + midi_slot_note record the manual's conflicting
    label so consumers do not have to guess. CAVEAT: the LIVE-CC ordering for the
    divergent machines was NOT independently hardware-verified in this pass (the
    2026-07-18 capture verified the bridge sysex path, addressed by NAME); if a
    future live-CC test contradicts rytm-rs, revisit these midi_cc values.
    machine_src_midi_order is kept verbatim as the manual cross-reference.
- id: v2-bridge-machine-gaps
  where: machines[*] bridge_param / bridge_interface.known_machine_gaps
  issue: |-
    The pinned rytm-rs does not expose every SRC param as bridge-settable: WAV on
    bd-sharp and bd-acoustic (reserved slot 7), RST on hh-basic (reserved slot 6),
    and WAV1/WAV2 on sy-raw are not settable via set_sound_parameter page:"machine".
    Separately, the 2026-07-18 recipe's bd-plastic `mod`/`typ:"a"` rejection was a
    NAMING/TYPE error, not a capability gap.
  sources:
    device: rytm-rs f2e8143 machine_parameters macros (commented/absent slots)
    calibration: '2026-07-18 capture finding #3'
  resolution: |-
    Marked bridge_param: null + bridge_settable: false on those params; documented
    the true bd-plastic keys (mod_level numeric, typ numeric 0/1) in
    bridge_interface.known_machine_gaps. These params still carry a midi_slot (live
    MIDI can still reach them); only the bridge sysex setter is missing.
- id: v2-enum-casing-two-regimes
  where: bridge_interface.enum_casing
  issue: |-
    Enum-valued params do NOT share one string casing. Sound-page enums
    (filter_type, LFO multiplier/destination/waveform/mode, velocity/aftertouch mod
    targets, chromatic_mode) use serde CamelCase (SampleStart, Tri, Lp2, ...).
    Machine type uses lowercase concatenated strings (bdplastic). Trig condition
    uses lowercase human strings (50%, fill, 1:2). The v1 calibration note that
    "enum values are CamelCase" is true ONLY for the sound-page enums.
  sources:
    daemon: hardware.rs parse_enum (serde) vs MachineType/TrigCondition TryFrom<&str>
    calibration: '2026-07-18 capture finding #1'
  resolution: Documented all three regimes in bridge_interface.enum_casing and inline on the relevant sections.
- id: v2-velmod-amt-range
  where: velocity_mod.amt / aftertouch_mod.amt
  issue: The pinned rytm-rs setter validates the mod amount as -127..=128 (then stores it in an i8), while the Elektron on-screen depth is -128..+127. The +128 is unreachable in i8 and -128 is reachable by wrap; treat -128..+127 as the usable range.
  sources:
    device: 'rytm-rs settings.rs #[parameter_range "…:-127..=128"] with i8 field'
    manual: SOUND SETTINGS 10.5.5
  resolution: Recorded amt as min -128 / max 127 with a note about the rytm-rs -127..=128 i8 quirk.
- id: v2-fill-polarity-swap
  where: trig_layer.fill_polarity
  issue: The pinned rytm-rs maps Fill->22 / FillNot->23, but on OS 1.72 device value 23 is the FILL-gated (silent-until-FILL) trig. The bridge therefore swaps "fill"/"fillnot" at the codec boundary so the public strings match the device panel.
  sources:
    daemon: hardware.rs swap_fill_condition
    verify: captured playback 2026-07-17 (commit c3a2794)
  resolution: Bridge public "fill"/"fillnot" mean the device-panel FILL/not-FILL; documented in trig_layer.fill_polarity.
# ==========================================================================
# BRIDGE-SURFACE SECTIONS (v2). Sourced to the manual +
# daemon (hardware.rs / state.rs @ bridge 65bc0d6) + rytm-rs @ f2e8143 + the
# 2026-07-18 hardware calibration capture. These describe how the AGENT BRIDGE
# addresses the device (by typed op + parameter NAME), joined to the MIDI/
# manual model above.
# ==========================================================================
velocity_mod:
  desc: 'Per-Sound velocity modulation matrix: up to four PARAMETER-page targets, each with a signed depth. Assigned in SOUND SETTINGS (manual 10.5.5). Bridge-settable via set_sound_parameter page:"settings".'
  manual_ref: SOUND SETTINGS > VELOCITY MOD (manual 10.5.5, p.33)
  daemon_ref: daemon/src/hardware.rs apply_sound_settings_parameter; rytm-rs sound/settings.rs
  slots: 4
  bridge:
    op: set_sound_parameter
    page: settings
    amt_params: [velocity_modulation_amt_1, velocity_modulation_amt_2, velocity_modulation_amt_3, velocity_modulation_amt_4]
    target_params: [velocity_modulation_target_1, velocity_modulation_target_2, velocity_modulation_target_3, velocity_modulation_target_4]
  amt:
    min: -128
    max: 127
    center: 0
    note: on-screen depth -128..+127 is inferred (standard Elektron bipolar depth; not independently verified against the manual's 10.5.5 numerals); the pinned rytm-rs setter validates -127..=128 (stored i8) — see uncertainties.v2-velmod-amt-range
    source: manual+daemon:rytm-rs@f2e8143
  target:
    type: enum
    enum_source: daemon SoundModTarget (rytm-rs sound/types.rs)
    casing: CamelCase serde variants (e.g. SampleStart) — NOT lowercase; see bridge_interface.enum_casing
    count: 40
    enum: [Unset, LfoMultiplier, LfoWaveform, LfoTrigMode, LfoSpeed, LfoFade, LfoPhase, LfoDepth, Syn1, Syn2, Syn3, Syn4, Syn5, Syn6, Syn7, Syn8, SampleTune, SampleFineTune, SampleSlice, SampleBitReduction, SampleStart, SampleEnd, SampleLoop, SampleLevel, FilterEnvelope, FilterAttack, FilterDecay, FilterSustain, FilterRelease, FilterFrequency, FilterResonance, AmpAttack, AmpHold, AmpDecay, AmpOverdrive, AmpVolume, AmpPan, AmpAccent, AmpDelaySend, AmpReverbSend]
  slot_params:
  - slot: 1
    amt_param: velocity_modulation_amt_1
    target_param: velocity_modulation_target_1
  - slot: 2
    amt_param: velocity_modulation_amt_2
    target_param: velocity_modulation_target_2
  - slot: 3
    amt_param: velocity_modulation_amt_3
    target_param: velocity_modulation_target_3
  - slot: 4
    amt_param: velocity_modulation_amt_4
    target_param: velocity_modulation_target_4
  related:
    velocity_to_volume:
      bridge_param: velocity_to_volume
      page: settings
      type: bool
      desc: 'The VEL>VOL toggle: when true, note velocity also scales amp volume. Set false to hear a velocity->target routing in isolation (calibration E3).'
aftertouch_mod:
  desc: 'Per-Sound aftertouch modulation matrix: up to four PARAMETER-page targets, each with a signed depth. Assigned in SOUND SETTINGS (manual 10.5.5). Bridge-settable via set_sound_parameter page:"settings".'
  manual_ref: SOUND SETTINGS > AFTERTOUCH (manual 10.5.5, p.33)
  daemon_ref: daemon/src/hardware.rs apply_sound_settings_parameter; rytm-rs sound/settings.rs
  slots: 4
  bridge:
    op: set_sound_parameter
    page: settings
    amt_params: [after_touch_modulation_amt_1, after_touch_modulation_amt_2, after_touch_modulation_amt_3, after_touch_modulation_amt_4]
    target_params: [after_touch_modulation_target_1, after_touch_modulation_target_2, after_touch_modulation_target_3, after_touch_modulation_target_4]
  amt:
    min: -128
    max: 127
    center: 0
    note: on-screen depth -128..+127 is inferred (standard Elektron bipolar depth; not independently verified against the manual's 10.5.5 numerals); the pinned rytm-rs setter validates -127..=128 (stored i8) — see uncertainties.v2-velmod-amt-range
    source: manual+daemon:rytm-rs@f2e8143
  target:
    type: enum
    enum_source: daemon SoundModTarget (rytm-rs sound/types.rs)
    casing: CamelCase serde variants (e.g. SampleStart) — NOT lowercase; see bridge_interface.enum_casing
    count: 40
    enum: [Unset, LfoMultiplier, LfoWaveform, LfoTrigMode, LfoSpeed, LfoFade, LfoPhase, LfoDepth, Syn1, Syn2, Syn3, Syn4, Syn5, Syn6, Syn7, Syn8, SampleTune, SampleFineTune, SampleSlice, SampleBitReduction, SampleStart, SampleEnd, SampleLoop, SampleLevel, FilterEnvelope, FilterAttack, FilterDecay, FilterSustain, FilterRelease, FilterFrequency, FilterResonance, AmpAttack, AmpHold, AmpDecay, AmpOverdrive, AmpVolume, AmpPan, AmpAccent, AmpDelaySend, AmpReverbSend]
  slot_params:
  - slot: 1
    amt_param: after_touch_modulation_amt_1
    target_param: after_touch_modulation_target_1
  - slot: 2
    amt_param: after_touch_modulation_amt_2
    target_param: after_touch_modulation_target_2
  - slot: 3
    amt_param: after_touch_modulation_amt_3
