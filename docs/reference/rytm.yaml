  # ----- D.6 SYNTH — usable on BD, SD, RS, CP tracks ------------------------
- id: sy-dual-vco
  name: "SY DUAL VCO"
  display: "Synth — Dual VCO"
  manual_ref: "APPENDIX D.6 (p.103)"
  tracks: [BD, SD, RS, CP]
  category: synth
  desc: >-
    Two-oscillator synth voice with selectable mix/ring/FM interaction, a
    fixed-time pitch bend envelope and independent per-oscillator decays.
    TUN value 0 = note C-2; one octave = 24 units (osc1), 48 units (osc2 DET).
  parameters:
  - pos: 1
    key: TUN
    name: "Osc 1 Tune"
    desc: "Pitch of oscillator 1 in semitones (0 = C-2; one octave = 24 units)."
    range:
      min: -32.0
      max: 32.0
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 2
    midi_cc: 17
    midi_nrpn: [1, 1]
    bridge_param: tun
  - pos: 2
    key: DET
    name: "Osc 2 Detune"
    desc: "Pitch of oscillator 2 relative to osc 1 (one octave = 48 units)."
    range:
      min: -16.0
      max: 16.0
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 4
    midi_cc: 19
    midi_nrpn: [1, 3]
    midi_slot_c8_label: "Balance"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 4 'Balance'; on-screen/device param here is DET (Osc 2 Detune). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: det
      # NOTE: the manual labels BOTH decay knobs 'DEC' (Osc 1 Decay, Osc 2 Decay).
      # Kept as printed; on hardware they are distinct knobs (see uncertainties).
  - pos: 3
    key: DEC
    name: "Osc 1 Decay"
    desc: "Decay time of oscillator 1's level. (Manual labels this DEC; distinct knob from the osc-2 decay below.)"
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 3
    midi_cc: 18
    midi_nrpn: [1, 2]
    bridge_param: dec1
  - pos: 4
    key: DEC
    name: "Osc 2 Decay"
    desc: "Decay time of oscillator 2's level. (Manual also labels this DEC.)"
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 5
    midi_cc: 20
    midi_nrpn: [1, 4]
    bridge_param: dec2
  - pos: 5
    key: CFG
    name: "Osc Config"
    range:
      enum: [+, R, F, FR, _]
      display: "+, R, F, FR, _"
      source: manual+daemon
      min: 0
      max: 79
    desc: "Selects the oscillator waveforms and interaction: + mix, R ring-mod, F linear FM (osc1 carrier), FR FM+ring, _ resets oscillators on trig. 2 osc1 waveforms (sine, sinesaw) x 5 osc2 waveforms (sine, skewed sine, triangle, sinesaw, saw)."
    midi_slot: 8
    midi_cc: 23
    midi_nrpn: [1, 7]
    midi_slot_c8_label: "Bend"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 8 'Bend'; on-screen/device param here is CFG (Osc Config). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: cfg
  - pos: 6
    key: BND
    name: "Bend"
    desc: "Depth of a fixed-time pitch envelope (one octave = 24 units)."
    range:
      min: -64
      max: 63
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 7
    midi_cc: 22
    midi_nrpn: [1, 6]
    midi_slot_c8_label: "Osc 2 Decay"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 7 'Osc 2 Decay'; on-screen/device param here is BND (Bend). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: bnd
  - pos: 7
    key: BAL
    name: "Balance"
    desc: "Levels of the two oscillators (0 = both max; negative attenuates osc2, positive attenuates osc1)."
    range:
      min: -64
      max: 63
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 6
    midi_cc: 21
    midi_nrpn: [1, 5]
    midi_slot_c8_label: "Osc Config"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 6 'Osc Config'; on-screen/device param here is BAL (Balance). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: bal
  - pos: 8
    key: LEV
    name: "Level"
    desc: "Overall machine volume."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 1
    midi_cc: 16
    midi_nrpn: [1, 0]
    bridge_param: lev

- id: sy-chip
  name: "SY CHIP"
  display: "Synth — Chip"
  manual_ref: "APPENDIX D.6 (p.103-104)"
  tracks: [BD, SD, RS, CP]
  category: synth
  desc: >-
    Chiptune-style voice modeled on 80s home-computer arpeggiation: the root
    note is followed by up to three offset notes at high speed to imply a
    chord. Rich waveform set (static analog, SID noise, animated, table-based,
    pulse-width).
  parameters:
  - pos: 1
    key: TUNE
    name: "Tune"
    desc: "Oscillator pitch in semitones."
    range:
      min: -24.0
      max: 24.0
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 2
    midi_cc: 17
    midi_nrpn: [1, 1]
    bridge_param: tun
  - pos: 2
    key: WAV
    name: "Waveform"
    desc: "Oscillator waveform: static (analog sine/asym-sine/triangle/sinesaw/saw/square, SID-style pitched noise), animated (Anim 1-5, PWM+/-), table-based (.TRI/+TRI/TRI+/TRI*, TBL1-3), and 1-99% pulse waves."
    range:
      enum_kind: symbolic
      note: set via symbolic string value (see machines notes / sy-chip waveform+speed tables)
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 7
    midi_cc: 22
    midi_nrpn: [1, 6]
    midi_slot_c8_label: "Offset 3"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 7 'Offset 3'; on-screen/device param here is WAV (Waveform). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: wav
  - pos: 3
    key: SPD
    name: "Speed"
    desc: "Internal arpeggiator speed: first a range of BPM note-divisions, then fixed Hz values, then single-shot (non-restarting) modes at the end of the list."
    range:
      enum_kind: symbolic
      note: set via symbolic string value (see machines notes / sy-chip waveform+speed tables)
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 8
    midi_cc: 23
    midi_nrpn: [1, 7]
    midi_slot_c8_label: "Offset 4"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 8 'Offset 4'; on-screen/device param here is SPD (Speed). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: spd
  - pos: 4
    key: DEC
    name: "Decay"
    desc: "Decay phase length."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 3
    midi_cc: 18
    midi_nrpn: [1, 2]
    bridge_param: dec
  - pos: 5
    key: OF2
    name: "Offset 2"
    desc: "First note offset from TUNE (builds the implied chord; 0 restarts/stops the arp)."
    range:
      min: -24
      max: 24
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 4
    midi_cc: 19
    midi_nrpn: [1, 3]
    midi_slot_c8_label: "Waveform"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 4 'Waveform'; on-screen/device param here is OF2 (Offset 2). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: of2
  - pos: 6
    key: OF3
    name: "Offset 3"
    desc: "Second note offset from TUNE (0 restarts/stops the arp)."
    range:
      min: -24
      max: 24
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 5
    midi_cc: 20
    midi_nrpn: [1, 4]
    midi_slot_c8_label: "Speed"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 5 'Speed'; on-screen/device param here is OF3 (Offset 3). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: of3
  - pos: 7
    key: OF4
    name: "Offset 4"
    desc: "Third note offset from TUNE (0 restarts/stops the arp)."
    range:
      min: -24
      max: 24
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 6
    midi_cc: 21
    midi_nrpn: [1, 5]
    bridge_param: of4
  - pos: 8
    key: LEV
    name: "Level"
    desc: "Overall machine volume."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 1
    midi_cc: 16
    midi_nrpn: [1, 0]
    bridge_param: lev

- id: sy-raw
