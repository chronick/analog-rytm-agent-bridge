# Analog Rytm MKII — machine-readable machine/parameter reference
# Distilled from the official Elektron user manual (OS 1.72). Structured for
# agent consumption by the Rytm bridge: every drum MACHINE, its SRC parameters,
# the shared drum-track parameter pages, the FX track pages, and the
# track->machine legality table.
#
#
# ---------------------------------------------------------------------------
# CONVENTIONS
#   - Each parameter: `key` (the 2-4 char on-screen label), `name` (expanded
#     label from the manual's parenthetical), `desc` (concise paraphrase of the
#     manual's explanation — NOT verbatim beyond the short label), and `range`
#     ONLY where the manual states one explicitly. Most Appendix D SRC params
#     give no range; those are omitted rather than guessed (Rytm data-entry
#     knobs are 0-127 or bipolar by default, but the manual does not confirm
#     per-param, so we do not assert it).
#   - `pos` = the parameter's ORDINAL position in the manual's listing for that
#     page/machine (1-based). On the Elektron parameter pages the eight
#     DATA ENTRY knobs read left-to-right A(1)..H(8), so pos maps to knob A..H
#     for pages/machines that fill all eight knobs. For machines with fewer
#     than eight parameters the manual TEXT does not state which physical knob
#     slots are used (the knob-layout appears only in page-diagram images that
#     did not survive PDF->markdown extraction), so we record ordinal position
#     rather than assert a possibly-wrong A-H letter. LEV is conventionally the
#     rightmost (H) knob on hardware regardless of ordinal.
# ---------------------------------------------------------------------------

meta:
  device: "Elektron Analog Rytm MKII"
  schema_version: 2
  os_version: "1.72"
  source_manual: "Analog-Rytm-MKII-User-Manual_ENG_OS1.72_250130.md"
  source_manual_pdf: "Analog-Rytm-MKII-User-Manual_ENG_OS1.72_250130.pdf"
  source_manual_dated: "2025-01-30"  # manual last updated (per title page)
  extraction_date: "2026-07-18"
  generation_method: >-
    Hand-distilled from the pymupdf4llm markdown extraction of the official
    Elektron OS 1.72 PDF manual. Machine SRC params from APPENDIX D (manual
    p.96-109); shared drum-track pages from APPENDIX A (p.77-80); FX track pages
    from APPENDIX B (p.81-84); track->machine legality from section 8.2
    "MACHINES" (manual p.21) cross-checked against the APPENDIX D per-section
    track headers. Constraints from TWO sources: the core voice/track/budget
    facts taken from a verified device-spec sheet compiled from Elektron's
    published specifications (2026-06-25), plus manual-sourced facts (songs, audio formats,
    parameter-page counts, total_sequencer_tracks) tagged inline with manual
    refs. Ranges recorded only where the manual states them verbatim.
  precedent: "the same structured-reference format used for the Octatrack"
  range_conventions: |-
    In v2 every `range:` is a STRUCTURED object, not a free-form string. Shape:
      min / max        numeric bounds of the value space (ints or floats)
      center           present for BIPOLAR params (the 0/detent point)
      unit             present when the manual states one (ms, s, MIDI note)
      enum             list of on-screen labels for enumerated / mixed selectors
      note             human note (e.g. enum<->index mapping, AUTO/OFF specials)
      cc_min / cc_max  MIDI wire value range, present only where a source states it
      display          the ORIGINAL on-screen range string verbatim (null when the
                       manual stated none and the bounds come from the device)
      source           provenance: "manual", "midi.guide", "manual+daemon", or
                       "daemon:rytm-rs@f2e8143" (bridge/device ground truth)
    Grammar families that were normalized: plain numeric ("0-120"), bipolar
    ("-64 to +63"), enum lists, enum+range ("OFF, 1-127"), unit-bearing
    ("0.03-30 ms", "0.1-2 s, A1, A2"). `min`/`max` describe the ON-SCREEN value
    except where source is a daemon/midi.guide wire range (then they are the
    API/wire bounds; see `display` for the on-screen string). The v1 note that a
    structural normalization was "deferred to a follow-up task" is now DONE.
  copyright_note: >-
    Parameter descriptions are concise paraphrases, not copies, of Elektron's
    manual prose. Manual (c) 2025 Elektron Music Machines MAV AB.

# ===========================================================================
# CONSTRAINTS — verified device spec, from TWO sources. Core voice/track/budget
# facts taken from a verified device-spec sheet compiled from Elektron's
# published specifications (2026-06-25); facts tagged "# manual:" below are sourced from the manual
# itself, not the build doc (songs, audio, parameter-page counts,
# total_sequencer_tracks). The coupled-voice / choke behavior is additionally
# confirmed in the manual (section 8.2, manual p.21): "Track CP mutes track RS,
# HT mutes MT, OH mutes CH and CB mutes CY."
# ===========================================================================
  v2_generation: |-
    v2 (schema_version 2) makes the reference fully
    machine-consumable and joins it to the BRIDGE surface. Additions over v1:
      - Structured ranges on EVERY parameter (machines + track pages + FX +
        trig/euclid/kit/perf). Machine SRC numeric ranges — which the manual does
        NOT state — are filled from the daemon's pinned rytm-rs (git f2e8143)
        `machine_parameters` macro (device ground truth), marked source
        "daemon:rytm-rs@f2e8143".
      - Per-machine-param `midi_slot` (the device synth-param slot from rytm-rs,
        = cc 15+slot / nrpn [1, slot-1] via midi.synth_param_slots) plus
        `bridge_param` (the exact key `set_sound_parameter page:"machine"` accepts).
        Where the manual's Appendix C.8 machine_src_midi_order disagrees with the
        device slot, `midi_slot_c8_label` + `midi_slot_note` flag the divergence
        per-param (see uncertainties.v2-midi-slot-c8-vs-rytmrs).
      - New sections velocity_mod, aftertouch_mod, scenes_performance, trig_layer,
        bridge_interface — sourced to the manual + daemon (hardware.rs / state.rs)
        + the 2026-07-18 hardware calibration capture.
    Ground-truth sources for v2: daemon/src/hardware.rs + state.rs (bridge @
    65bc0d6), rytm-rs @ f2e8143, and
    vault/seeds/sound-design/captures/2026-07-18-anchors-calibration.md.
constraints:
  drum_tracks: 12
  fx_tracks: 1
  total_sequencer_tracks: 13   # 12 drum + 1 FX. manual: derived from the track structure (not in rytm-build.yaml)
  physical_voices: 8           # max 8 simultaneous sounds (polyphony ceiling)
  dedicated_voice_tracks: [BD, SD, BT, LT]   # independent, never choke
  coupled_voice_pairs:
    # Each pair shares ONE physical voice; the right-hand track has priority
    # and chokes the left-hand track when both are triggered.
  - {pair: [RS, CP], chokes: "CP mutes RS", shared_voice: true}
  - {pair: [MT, HT], chokes: "HT mutes MT", shared_voice: true}
  - {pair: [CH, OH], chokes: "OH mutes CH", shared_voice: true}
  - {pair: [CY, CB], chokes: "CB mutes CY", shared_voice: true}
  default_track_layout:   # factory pad 1-12 -> track type
    1: BD
    2: SD
    3: RS
    4: CP
    5: BT
    6: LT
    7: MT
    8: HT
    9: CH
    10: OH
    11: CY
    12: CB
  budgets:
    kits_per_project: 128
    banks: 8                    # A-H
    patterns_per_bank: 16
    patterns_per_project: 128   # 8 banks x 16
    songs: 16                   # SONG mode slots (per project). manual: SONG mode chapter (not in rytm-build.yaml)
    scenes_per_kit: 12
    perf_macros_per_kit: 12
    sample_slots_per_project: 127
    plus_drive_sample_store: "1 GB"
  audio:
    # manual: two DISTINCT audio specs — do not conflate. The sample engine's
    # native file format is 16-bit, but the analog I/O converters are 24-bit.
    sample_format: "16-bit, 48 kHz, mono"   # manual: sample-engine native audio format (14.2.3 — transfers auto-convert to this)
    converters: "24-bit, 48 kHz D/A and A/D" # manual: HARDWARE appendix — the physical converter spec
  parameter_pages_per_drum_track: 5   # SRC, SMPL, FLTR, AMP, LFO. manual: APPENDIX A (not in rytm-build.yaml)
  parameter_pages_per_fx_track: 5     # DELAY, REVERB, DISTORTION, COMPRESSOR, LFO. manual: APPENDIX B (not in rytm-build.yaml)
  source_constraints: "verified device-spec sheet (Elektron published specifications, 2026-06-25)"

# ===========================================================================
# MIDI — the CC / NRPN control map (APPENDIX C: MIDI, manual p.85-95) joined
# onto the parameter schema. Ground truth is the manual's APPENDIX C; every
# number below was cross-checked against midi.guide
# (https://midi.guide/d/elektron/analog-rytm-mkii/). Where the two sources
# disagree, BOTH values are recorded in the `uncertainties:` block (ids
# prefixed `midi-`) rather than silently resolved. midi.guide-only additions
# (value ranges / orientation) are marked `source: midi.guide`.
#
# ADDRESSING IN ONE LINE: each drum track (12) and the FX track has its OWN
# MIDI channel; a CC/NRPN on a track's channel addresses THAT track. The same
# CC number therefore means different things on a drum-track channel vs the
# FX-track channel (CC16 = Synth slot 1/Level on a drum track, but = Delay Time
# on the FX track) — disambiguated by channel AND by NRPN MSB (synth/sample/
# filter/amp/lfo = NRPN MSB 1, FX = NRPN MSB 2, kit/perf/trig/euclid = other).
#
# The page-level maps for the SHARED pages (SMPL/FLTR/AMP/LFO) live INLINE as
# `cc:` / `nrpn:` keys on each parameter under `track_pages:`; likewise the FX
# pages under `fx_track:`. This section carries the addressing model, the
# machine-independent maps (trig/euclid/kit/perf), and the knob-indexed SRC
# synth-slot map plus its per-machine ordering.
# ===========================================================================
midi:
  manual_ref: "APPENDIX C: MIDI (p.85-95)"
  cross_check: "https://midi.guide/d/elektron/analog-rytm-mkii/"
  nrpn_notation: "`nrpn: [MSB, LSB]`. `cc` is the CC MSB; `cc_lsb` is present only for high-resolution params."

  addressing:
    model: >-
      Each of the 12 drum tracks and the 1 FX track has its own MIDI channel
      (GLOBAL SETTINGS > MIDI CONFIG > CHANNELS: TRACK 1-12 + FX). A CC/NRPN
      sent on a track's channel addresses that track's parameters. Identical CC
      numbers on different channels address different tracks; the synth/sample/
      filter/amp/lfo params (NRPN MSB 1) and the FX params (NRPN MSB 2) reuse
      the CC ranges 16-23 and 70-85, kept distinct by channel + NRPN MSB.
    track_channels: >-
      Set per track in CHANNELS (TRACK 1-12, FX). Factory default = MIDI
      channels 1-12 for the twelve drum tracks (order = constraints.default_track_layout).
      An OFF setting makes that track disregard incoming MIDI.
    auto_channel: >-
      AUTO CHANNEL addresses whichever track is currently ACTIVE (one channel
      that follows the active track). Also the fallback channel for program
      change in/out when those are set to AUTO.
    perf_channel: "PERF CHANNEL — the channel the DATA ENTRY knobs transmit on in PERFORMANCE mode."
    param_output: >-
      MIDI CONFIG > PORT CONFIG > PARAM OUTPUT selects whether the DATA ENTRY
      knobs emit CC or NRPN; OUTPUT CH selects auto-channel vs track-channel for
      the pads/knobs.
    receive_flags: >-
      RECEIVE NOTES enables external note triggering; RECEIVE CC/NRPN enables
      external parameter control (both in MIDI CONFIG > PORT CONFIG).
    program_change:
      maps: "MIDI Program Change 0-127 selects pattern 1-128 (A01-H16)."
      manual_ref: "section 8.6 (p.22) + 14.4 CHANNELS/SYNC (p.61-63)"
      receive: "Enable PRG CH RECEIVE (MIDI CONFIG > SYNC). Listen channel = PROGRAM CH IN CH (AUTO = auto channel)."
      send: "Enable PRG CH SEND. Send channel = PROGRAM CH OUT CH (AUTO = auto channel)."

  note_map:
    manual_ref: "APPENDIX C.8 MIDI NOTE TRIGGERS (p.95) + section 8.6 (p.22)"
    numbering_note: >-
      The manual numbers TWO subsections 'C.8': C.8 MACHINE PARAMETERS (p.88-95)
      and C.8 MIDI NOTE TRIGGERS (p.95). The note-triggers section (referenced
      here) is effectively C.9; we cite it as printed.
    track_triggers:
      desc: >-
        MIDI notes 0-11 (C0-B0; some DAWs label this octave C-2..B-2) trigger
        the Sound of drum tracks 1-12 respectively, regardless of which track is
        active, PROVIDED each track is on its default channel 1-12.
      map: {0: BD, 1: SD, 2: RS, 3: CP, 4: BT, 5: LT, 6: MT, 7: HT, 8: CH, 9: OH, 10: CY, 11: CB}
      note: "Order follows constraints.default_track_layout (pad 1-12 -> track type)."
    chromatic:
      range:
        min: 12
        max: 59
        unit: MIDI note
        note: C1-B4 (active track chromatic play)
        display: "notes 12-59 (C1-B4)"
        source: manual
      desc: >-
        Plays the ACTIVE track's Sound across its 48 chromatic variations (as in
        CHROMATIC mode). The track's Sound must be chromatic-enabled (SOUND SETTINGS).
    trig_note_param_range: "The Trig Note PARAMETER (cc 3 / nrpn 3:0, see trig_parameters) is listed with range 36-84 by midi.guide. source: midi.guide"

  # --- Machine-independent maps -------------------------------------------
  trig_parameters:
    manual_ref: "APPENDIX C.1 GENERAL TRIG PARAMETERS (p.85)"
    desc: "Per-trig parameters, addressed on the track's MIDI channel."
    parameters:
    - key: NOTE
      name: "Note"
      cc: 3
      nrpn: [3, 0]
      range:
        min: 36
        max: 84
        source: midi.guide
        display: "36-84 (source: midi.guide)"
    - key: VEL
      name: "Velocity"
      cc: 4
      nrpn: [3, 1]
      range:
        min: 1
        max: 127
        source: midi.guide
        display: "1-127 (source: midi.guide)"
    - {key: LEN, name: "Length", cc: 5, nrpn: [3, 2]}
    - {key: SYN, name: "Synth Trig", cc: 11, nrpn: [3, 3]}
    - {key: SMP, name: "Sample Trig", cc: 12, nrpn: [3, 4]}
    - {key: ENV, name: "ENV Trig", cc: 13, nrpn: [3, 5]}
    - {key: LFO, name: "LFO Trig", cc: 14, nrpn: [3, 6]}

  euclidean_parameters:
    manual_ref: "APPENDIX C.2 EUCLIDEAN SEQUENCER PARAMETERS (p.85)"
    parameters:
    - {name: "Pulse Generator 1", cc: 86, nrpn: [3, 8]}
    - {name: "Pulse Generator 2", cc: 87, nrpn: [3, 9]}
    - {name: "Euclidean On/Off", cc: 117, nrpn: [3, 14]}
    - {name: "Rotation Generator 1", cc: 89, nrpn: [3, 11]}
    - {name: "Rotation Generator 2", cc: 90, nrpn: [3, 12]}
    - {name: "Track Rotation", cc: 91, nrpn: [3, 13]}
    - name: "Boolean Operator"
      cc: 88
      nrpn: [3, 10]
      range:
        min: 0
        max: 3
        enum: [OR, XOR, AND, SUB]
        source: midi.guide
        display: "0-3 = OR/XOR/AND/SUB (source: midi.guide)"

  kit_parameters:
    manual_ref: "APPENDIX C.3 GENERAL KIT PARAMETERS / COMMON (p.85)"
    desc: "Per-track kit/common parameters."
    parameters:
    - {name: "Track Level", cc: 95, nrpn: [1, 100]}
    - {name: "Track Mute", cc: 94, nrpn: [1, 101], note: "sequencer mute"}
    - {name: "Track Solo", cc: 93, nrpn: [1, 102], note: "sequencer solo"}
    - {name: "Track Machine Type", cc: 15, nrpn: [1, 103], note: "Selects the SRC machine (see legality). midi.guide range 1-33 (33 selectable types) vs 34 machine entries here incl. DISABLE — see uncertainties.midi-machine-type-count. source: midi.guide (range)"}
    - {name: "Active Scene", cc: 92, nrpn: [1, 104]}

  performance_parameters:
    manual_ref: "APPENDIX C.4 PERFORMANCE PARAMETERS (p.85-86)"
    channel: "PERF CHANNEL"
    note: "CC 38 is SKIPPED between Perf Param 3 (cc 37) and Perf Param 4 (cc 39). midi.guide compresses these as a contiguous CC 35-47 range — see uncertainties.midi-performance-cc38-skip."
    parameters:
    - {name: "Performance Parameter 1", cc: 35, nrpn: [0, 0]}
    - {name: "Performance Parameter 2", cc: 36, nrpn: [0, 1]}
    - {name: "Performance Parameter 3", cc: 37, nrpn: [0, 2]}
    - {name: "Performance Parameter 4", cc: 39, nrpn: [0, 3]}
    - {name: "Performance Parameter 5", cc: 40, nrpn: [0, 4]}
    - {name: "Performance Parameter 6", cc: 41, nrpn: [0, 5]}
    - {name: "Performance Parameter 7", cc: 42, nrpn: [0, 6]}
    - {name: "Performance Parameter 8", cc: 43, nrpn: [0, 7]}
    - {name: "Performance Parameter 9", cc: 44, nrpn: [0, 8]}
    - {name: "Performance Parameter 10", cc: 45, nrpn: [0, 9]}
    - {name: "Performance Parameter 11", cc: 46, nrpn: [0, 10]}
    - {name: "Performance Parameter 12", cc: 47, nrpn: [0, 11]}

  # --- SRC / MACHINE synth params: knob-indexed (see machines: header) -----
  synth_param_slots:
    manual_ref: "APPENDIX C.5 SYNTH (p.86) + C.8 MACHINE PARAMETERS (p.88-95)"
    desc: >-
      The SRC/machine synthesis parameters are addressed by KNOB SLOT, not by a
      machine-specific CC. The eight synth slots are ALWAYS the same numbers:
      slot 1..8 -> cc 16..23 -> nrpn [1, 0..7]. What each slot MEANS depends on
      the active machine (Track Machine Type, kit_parameters). Slot 1 is Level on
      every machine. IMPORTANT: the manual's C.8 MIDI ordering per machine OFTEN
      DIFFERS in order AND naming from the on-screen SRC-page order recorded as
      `pos` under `machines:` (see machine_src_midi_order and
      uncertainties.midi-appendixC-vs-appendixD-src).
    slots:
    - {slot: 1, cc: 16, nrpn: [1, 0]}
    - {slot: 2, cc: 17, nrpn: [1, 1]}
    - {slot: 3, cc: 18, nrpn: [1, 2]}
    - {slot: 4, cc: 19, nrpn: [1, 3]}
    - {slot: 5, cc: 20, nrpn: [1, 4]}
    - {slot: 6, cc: 21, nrpn: [1, 5]}
    - {slot: 7, cc: 22, nrpn: [1, 6]}
    - {slot: 8, cc: 23, nrpn: [1, 7]}

  machine_src_midi_order:
    manual_ref: "APPENDIX C.8 MACHINE PARAMETERS (p.88-95)"
    desc: >-
      Per-machine SRC synth-slot order, AS PRINTED IN APPENDIX C.8 (the MIDI
      order). Read as slot 1..N left-to-right; slot i -> cc (15+i) -> nrpn
      [1, i-1] via synth_param_slots. This C.8 MIDI order differs from the
      Appendix D SRC-page params in `machines:` (both order and, for some
      machines, naming) — do NOT assume machines[*].parameters[pos] lines up
      with slot pos. midi.guide corroborates these C.8 orderings.
    by_machine:
      bd-hard: ["Level", "Tune", "Decay", "Hold", "Sweep Time", "Sweep Depth", "Waveform", "Transient Tick"]
      bd-classic: ["Level", "Tune", "Decay", "Hold", "Sweep Time", "Sweep Depth", "Waveform", "Transient Tick"]
      bd-fm: ["Level", "Tune", "Decay", "FM Amount", "Sweep Time", "FM Sweep Time", "FM Decay Time", "FM Tune"]
      bd-plastic: ["Level", "Tune", "Decay Time", "Sweep Depth", "Sweep Time", "Hold Time", "VCO Click", "Dust Level"]
      bd-silky: ["Level", "Tune", "Decay", "Sweep Depth", "Sweep Time", "Hold", "VCO Click", "Dust Level"]
      bd-sharp: ["Level", "Tune", "Decay", "Sweep Depth", "Sweep Time", "Hold Time", "Tick Level", "Waveform"]
      bd-acoustic: ["Level", "Tune", "Decay", "Sweep Depth", "Sweep Time", "Hold Time", "Impact", "Waveform"]
      sd-hard: ["Level", "Tune", "Decay", "Sweep Depth", "Tick Level", "Noise Decay", "Noise Level", "Sweep Time"]
      sd-classic: ["Level", "Tune", "Decay", "Detune", "Snap Amount", "Noise Decay", "Noise Level", "Osc Balance"]
      sd-fm: ["Level", "Tune", "Decay", "FM Tune", "FM Decay Time", "Noise Decay", "Noise Level", "FM Amount"]
      sd-natural: ["Level", "Tune", "Body Decay", "Noise Decay", "Noise LPF", "Noise Balance", "Noise Resonance", "Noise HPF"]
      sd-acoustic: ["Level", "Tune", "Decay", "Noise Decay", "Hold Time", "Noise Level", "Impact", "Sweep Depth"]
      rs-hard: ["Level", "Tune", "Decay", "Sweep Depth", "Tick Level", "Noise Level", "Symmetry", "Sweep Time"]
      rs-classic: ["Level", "Tune Osc 1", "Decay", "Osc Balance", "Tune Osc 2", "Symmetry", "Noise Level", "Tick Level"]
      cp-classic: ["Level", "Noise Tone", "Noise Decay", "Clap Number", "Clap Rate", "Noise Level", "Random Claps", "Clap Decay"]
      sy-dual-vco: ["Level", "Osc 1 Tune", "Osc 1 Decay", "Balance", "Osc 2 Detune", "Osc Config", "Osc 2 Decay", "Bend"]
      sy-chip: ["Level", "Tune", "Decay", "Waveform", "Speed", "Offset 2", "Offset 3", "Offset 4"]
      sy-raw: ["Level", "Tune", "Decay", "Noise Level", "Osc 2 Detune", "Waveform 1", "Waveform 2", "Balance"]
      bt-classic: ["Level", "Tune", "Decay", "Sweep Depth", "Noise Level", "Snap Type"]
      xt-classic: ["Level", "Tune", "Decay", "Sweep Depth", "Sweep Time", "Noise Decay", "Noise Level", "Noise Tone"]
      ch-classic: ["Level", "Tune", "Decay", "Color"]
      ch-metallic: ["Level", "Tune", "Decay Time"]
      oh-classic: ["Level", "Tune", "Decay", "Color"]
      oh-metallic: ["Level", "Tune", "Decay Time"]
      hh-basic: ["Level", "Tune", "Decay Time", "Tone", "Transient Decay", "Osc Reset"]
      hh-lab: ["Level", "Tune 1", "Decay Time", "Tune 2", "Tune 3", "Tune 4", "Tune 5", "Tune 6"]
      cy-classic: ["Level", "Tune", "Decay", "Color", "Tone"]
      cy-metallic: ["Level", "Tune", "Decay Time", "Tone", "Transient Decay"]
      cy-ride: ["Level", "Tune", "Tail Decay", "Hit Decay", "Cymbal Type", "Component 1", "Component 2", "Component 3"]
      cb-classic: ["Level", "Tune", "Decay Time", "Detune"]
      cb-metallic: ["Level", "Tune", "Decay Time", "Detune"]
      ut-noise: ["Level", "LP Frequency", "Decay", "Sweep Depth", "Sweep Time", "LP Resonance", "HP Frequency", "Attack"]
      ut-impulse: ["Level", "Attack", "Decay", "Polarity"]
    notes:
    - "disable has no SRC params (no synth slots)."
    - "xt-classic is printed 'LT, MT, HT CLASSIC' in C.8 — one shared MIDI map for all three tom tracks (matches the single XT machine)."
    - "cb-classic and cb-metallic share one C.8 map printed 'CB CLASSIC & METALLIC'."
    - "SY machines (sy-dual-vco/sy-chip/sy-raw): C.8 prints CC only with BLANK NRPN columns; the C.5 generic map still implies nrpn [1, 0..7]. See uncertainties.midi-sy-machines-nrpn-blank."
    - "hh-lab: the C.8 NRPN LSB column extracted garbled (1:3,1:3,1:3,1:4,1:5); the CC column (16-23) is intact and the true NRPN LSBs are the sequential 1:0-1:7 per synth_param_slots (midi.guide corroborates). See uncertainties.midi-hh-lab-nrpn-garbled."
    - "cb-classic / cb-metallic: the shared C.8 table maps only 4 slots (Level, Tune, Decay Time, Detune). The two pulse-width SRC params (PW1/PW2, machines[cb-*].pos 4-5) have NO CC/NRPN in Appendix C — they are MIDI-UNMAPPED. See uncertainties.midi-cowbell-pw-unmapped."

# ===========================================================================
# TRACK PAGES — the shared drum-track PARAMETER pages (APPENDIX A). Every drum
# track exposes these identical pages EXCEPT the SRC page, whose parameters are
# machine-dependent (see `machines:` below). SRC is described here only as a
# pointer; its concrete params live per-machine.
# ===========================================================================
track_pages:

  SRC:
    manual_ref: "APPENDIX A.1 (p.77)"
    key: SRC
    name: "Source / synthesis"
    machine_dependent: true
    desc: >-
      Controls the analog + digital sound synthesis. Parameters vary with the
      active MACHINE — see `machines:` for the per-machine SRC parameter set.
      The manual's default example is the BD track with the BD HARD (BDHD)
      machine. Double-tap the SRC [PARAMETER] key to change MACHINE.
    midi: >-
      SRC params are MIDI-addressed by KNOB SLOT, not per-machine CC: slot 1..8
      -> cc 16..23 -> nrpn [1, 0..7] (midi.synth_param_slots). The per-machine
      slot ordering is midi.machine_src_midi_order (and differs from the `pos`
      order below). Select the machine itself via kit Track Machine Type
      (cc 15 / nrpn [1, 103]).

  SMPL:
    manual_ref: "APPENDIX A.2 / A.3 (p.77-78)"
    key: SMPL
    name: "Sample playback"
    desc: >-
      Controls playback of the assigned sample. A project has 127 sample slots,
      dynamically allocated per kit. SMPL page 1 is the numeric view; SMPL
      page 2 shows the same parameters graphically over the sample waveform
      (toggle with [SMPL]).
    midi_ref: "APPENDIX C.5 SAMPLE (p.86)"
    parameters:
    - pos: 1
      key: TUN
      name: "Tune"
      range:
        min: -24
        max: 24
        center: 0
        display: "-24 to +24"
        source: manual
        cc_min: 40
        cc_max: 88
      cc: 24
      nrpn: [1, 8]
      desc: "Sample pitch in chromatic semitones (bipolar, 0 = unchanged; +/-24 = four octaves). midi.guide: cc range 40-88, centered."
    - pos: 2
      key: FIN
      name: "Fine Tune"
      range:
        min: -64
        max: 63
        center: 0
        display: "-64 to +63"
        source: manual
      cc: 25
      nrpn: [1, 9]
      desc: "Fine pitch offset from TUN; full range spans one semitone down to one up (bipolar)."
    - {pos: 3, key: BR, name: "Bit Reduction", cc: 26, nrpn: [1, 10], desc: "Lowers sample resolution for a grainy, dirty lo-fi character."}
    - pos: 4
      key: SMP
      name: "Sample Slot"
      range:
        min: 1
        max: 127
        enum: ['OFF']
        note: OFF is a distinct setting (cc 0) below the 1-127 range
        display: "OFF, 1-127"
        source: manual
      cc: 27
      nrpn: [1, 11]
      desc: "Selects one of up to 127 project samples. OFF (cc 0) plays no sample."
    - pos: 5
      key: STA
      name: "Start"
      range:
        min: 0
        max: 120
        display: "0-120"
        source: manual
      cc: 28
      nrpn: [1, 12]
      desc: "Sample playback start point (0 = very beginning, 120 = very end). Codependent with END."
    - pos: 6
      key: END
      name: "End"
      range:
        min: 0
        max: 120
        display: "0-120"
        source: manual
      cc: 29
      nrpn: [1, 13]
      desc: "Sample playback end point. If END < STA the sample plays backward."
    - pos: 7
      key: LOP
      name: "Loop"
      range:
        min: 0
        max: 1
        enum: ['OFF', 'ON']
        note: 0=OFF, 1=ON
        display: "OFF, ON"
        source: manual
      cc: 30
      nrpn: [1, 14]
      desc: "OFF = one-shot per trig. ON = loops for the trig length (bounded by AMP HLD/DEC)."
    - {pos: 8, key: LEV, name: "Level", cc: 31, nrpn: [1, 15], desc: "Sample volume."}

  FLTR:
    manual_ref: "APPENDIX A.4 (p.78)"
    key: FLTR
    name: "Filter + filter envelope"
    desc: >-
      The analog multimode filter and its dedicated AHDSR-style envelope.
      Technically all seven types are resonant 2-pole filters; the 1-pole
      variants have a flatter response suited to EQ duty.
    midi_ref: "APPENDIX C.5 FILTER (p.86)"
    parameters:
    - {pos: 1, key: ATK, name: "Attack", cc: 70, nrpn: [1, 16], desc: "Filter-envelope attack time."}
    - {pos: 2, key: DEC, name: "Decay", cc: 71, nrpn: [1, 17], desc: "Filter-envelope decay time."}
    - {pos: 3, key: SUS, name: "Sustain Level", cc: 72, nrpn: [1, 18], desc: "Filter-envelope sustain level."}
    - {pos: 4, key: REL, name: "Release", cc: 73, nrpn: [1, 19], desc: "Filter-envelope release time."}
    - {pos: 5, key: FRQ, name: "Frequency", cc: 74, nrpn: [1, 20], desc: "Filter cutoff frequency."}
    - {pos: 6, key: RES, name: "Resonance", cc: 75, nrpn: [1, 21], desc: "Resonance peak at cutoff (a notch, not a peak, for the Bandstop type)."}
    - pos: 7
      key: TYP
      name: "Filter Type"
      range:
        min: 0
        max: 6
        enum: [LP2, LP1, BP, HP1, HP2, BS, PK]
        note: 'enum index 0..6; bridge serde casing: Lp2,Lp1,Bp,Hp1,Hp2,Bs,Pk'
        display: "LP2, LP1, BP, HP1, HP2, BS, PK"
        source: manual
        cc_min: 0
        cc_max: 6
      cc: 76
      nrpn: [1, 22]
      desc: "Selects one of seven filter types (see filter_types). Manual/Appendix C calls this 'Filter Mode'. midi.guide: cc range 0-6, order matches filter_types."
    - {pos: 8, key: ENV, name: "Envelope Depth", cc: 77, nrpn: [1, 23], desc: "Depth of filter-envelope modulation of cutoff (bipolar: negative or positive; midi.guide: centered)."}
    filter_types:
      # TYP selectable types, in manual order.
    - {id: LP2, name: "2-pole Lowpass"}
    - {id: LP1, name: "1-pole Lowpass"}
    - {id: BP, name: "Bandpass"}
    - {id: HP1, name: "1-pole Highpass"}
    - {id: HP2, name: "2-pole Highpass"}
    - {id: BS, name: "Bandstop"}
    - {id: PK, name: "Peak"}

  AMP:
    manual_ref: "APPENDIX A.5 (p.79)"
    key: AMP
    name: "Amplitude envelope, overdrive, sends, pan, volume"
    desc: >-
      Amp envelope plus overdrive, the two FX send amounts (delay/reverb),
      panning and volume. Overdrive sits BEFORE the multimode filter in the
      signal path.
    midi_ref: "APPENDIX C.5 AMP (p.86-87)"
    parameters:
    - {pos: 1, key: ATK, name: "Attack", cc: 78, nrpn: [1, 24], desc: "Amp-envelope attack time."}
    - pos: 2
      key: HLD
      name: "Hold"
      range:
        min: 1
        max: 127
        enum: [AUTO]
        note: AUTO is a distinct setting separate from the 1-127 numeric range
        display: "AUTO, 1-127"
        source: manual
      cc: 79
      nrpn: [1, 25]
      desc: "Amp-envelope hold time before decay. AUTO = held while the pad is pressed; 1-127 fixes the hold length."
    - {pos: 3, key: DEC, name: "Decay", cc: 80, nrpn: [1, 26], desc: "Amp-envelope decay time."}
    - {pos: 4, key: OVR, name: "Overdrive", cc: 81, nrpn: [1, 27], desc: "Amp overdrive/gain boost, pre-filter."}
    - {pos: 5, key: DEL, name: "Delay Send", cc: 82, nrpn: [1, 28], desc: "Amount sent to the Delay FX (FX track)."}
    - {pos: 6, key: REV, name: "Reverb Send", cc: 83, nrpn: [1, 29], desc: "Amount sent to the Reverb FX (FX track)."}
    - pos: 7
      key: PAN
      name: "Pan"
      range:
        min: -64
        max: 63
        center: 0
        display: "-64 to +63"
        source: manual
      cc: 10
      nrpn: [1, 30]
      desc: "Stereo position (bipolar; 0 = center, -64 = full left, +63 = full right). cc 10 = standard MIDI Pan; midi.guide: centered."
    - {pos: 8, key: VOL, name: "Volume", cc: 7, nrpn: [1, 31], desc: "Sound amplification volume, independent of the overall track level. cc 7 = standard MIDI Channel Volume."}

  LFO:
    manual_ref: "APPENDIX A.6 (p.79-80)"
    key: LFO
    name: "Per-track LFO"
    desc: >-
      One LFO per drum track, assignable to any parameter on the SRC, SMPL,
      FLTR or AMP pages.
    midi_ref: "APPENDIX C.6 LFO (p.87)"
    parameters:
    - {pos: 1, key: SPD, name: "Speed", cc: 102, nrpn: [1, 32], desc: "LFO speed (bipolar; negative runs the cycle backward). Try 8/16/32 for beat-synced motion."}
    - {pos: 2, key: MUL, name: "Multiplier", cc: 103, nrpn: [1, 33], desc: "Multiplies SPD. 24 settings: 12 tempo-synced (x, multiply current BPM) + 12 free (dot, sync to 120 BPM regardless of tempo)."}
    - {pos: 3, key: FAD, name: "Fade In/Out", cc: 104, nrpn: [1, 34], desc: "Fades the LFO modulation in or out (bipolar; positive = fade-out, negative = fade-in, 0 = no fade)."}
    - {pos: 4, key: DST, name: "Destination", cc: 105, nrpn: [1, 35], desc: "Chooses the modulation target — any parameter on the SRC/SMPL/FLTR/AMP pages (selected from a live list, confirmed with [YES]). midi.guide: cc range 0-41."}
    - pos: 5
      key: WAV
      name: "Waveform"
      range:
        min: 0
        max: 6
        enum: [TRI, SINE, SQR, SAW, EXP, RMP, RND]
        note: 'enum index 0..6; on-screen labels. Bridge serde casing: Tri,Sin,Sqr,Saw,Exp,Rmp,Rnd'
        display: "TRI, SINE, SQR, SAW, EXP, RMP, RND"
        source: manual
        cc_min: 0
        cc_max: 6
      cc: 106
      nrpn: [1, 36]
      desc: "LFO waveform (see lfo_waveforms). midi.guide: cc range 0-6, order matches lfo_waveforms."
    - pos: 6
      key: SPH
      name: "Start Phase"
      range:
        min: 0
        max: 127
        display: "0-127"
        source: manual
      cc: 107
      nrpn: [1, 37]
      desc: "Cycle start position when trigged (0 = start, 64 = center, 127 = end). With WAV=RND, adds slew to the random transitions instead."
    - pos: 7
      key: MOD
      name: "Trig Mode"
      range:
        min: 0
        max: 4
        enum: [FREE, TRIG, HOLD, ONE, HALF]
        note: 'enum index 0..4; bridge serde casing: Free,Trig,Hold,One,Half'
        display: "FREE, TRIG, HOLD, ONE, HALF"
        source: manual
        cc_min: 0
        cc_max: 4
      cc: 108
      nrpn: [1, 38]
      desc: "How the LFO responds to a trig (see lfo_trig_modes). midi.guide: cc range 0-4."
    - {pos: 8, key: DEP, name: "Depth", cc: 109, cc_lsb: 118, nrpn: [1, 39], desc: "Modulation depth and polarity (bipolar; positive starts toward the crest, negative toward the trough, 0 = none). HIGH-RESOLUTION: cc MSB 109 + cc LSB 118; midi.guide: centered."}
    lfo_waveforms:
    - {id: TRI, name: "Triangle"}
    - {id: SINE, name: "Sine"}
    - {id: SQR, name: "Square"}
    - {id: SAW, name: "Sawtooth"}
    - {id: EXP, name: "Exponential"}
    - {id: RMP, name: "Ramp"}
    - {id: RND, name: "Random"}
    lfo_trig_modes:
    - {id: FREE, desc: "Free-running; never restarts or stops (default)."}
    - {id: TRIG, desc: "Restarts on each trig."}
    - {id: HOLD, desc: "Runs free in background; latches/holds its output level at each trig until the next."}
    - {id: ONE, desc: "Starts on trig, runs to end of waveform, then stops (envelope-like)."}
    - {id: HALF, desc: "Starts on trig, runs to the middle of the waveform, then stops."}
    lfo_destinations:
      enumerated: false
      note: >-
        The manual does not enumerate a fixed destination list; DST can target
        ANY parameter on the SRC, SMPL, FLTR and AMP pages of the same track
        (the concrete list depends on the active machine).

# ===========================================================================
# MACHINES — every SRC-page machine in APPENDIX D (manual p.96-109).
# `tracks` = the drum tracks the machine is legal on (from the APPENDIX D
# per-section track headers, cross-checked with section 8.2).
# Machine SRC params give no explicit ranges in the manual except where noted.
#
# MIDI ADDRESSING (indirection — no per-machine `cc:` keys are added here on
# purpose): SRC synth params are addressed by KNOB SLOT, not per-machine CC —
# slot 1..8 -> cc 16..23 -> nrpn [1, 0..7] (see midi.synth_param_slots). The
# machine itself is selected via kit Track Machine Type (cc 15 / nrpn [1, 103]).
# CRUCIAL: the manual's Appendix C.8 MIDI slot ordering per machine differs from
# the Appendix D SRC-page order (and, for a few machines, the naming) recorded
# as `pos` below. So `parameters[].pos` here is the ON-SCREEN order and does NOT
# reliably equal the MIDI slot number. To get a param's CC/NRPN, look up the
# machine in midi.machine_src_midi_order (Appendix C.8 order) and map its slot
# via midi.synth_param_slots. See uncertainties.midi-appendixC-vs-appendixD-src.
# ===========================================================================
machines:

  # ----- D.1 ALL — usable on ALL 12 drum tracks -----------------------------
- id: disable
  name: "DISABLE"
  display: "Machine Disabled"
  manual_ref: "APPENDIX D.1 (p.96)"
  tracks: [BD, SD, RS, CP, BT, LT, MT, HT, CH, OH, CY, CB]
  category: all
  desc: >-
    Disables the SRC synthesis engine (no SRC parameters). Select DISABLE
    then save to make a purely sample-based Sound loadable / Sound-Lockable
    on any of the 12 tracks.
  parameters: []

- id: ut-noise
  name: "UT NOISE"
  display: "White Noise Generator"
  manual_ref: "APPENDIX D.1 (p.96)"
  tracks: [BD, SD, RS, CP, BT, LT, MT, HT, CH, OH, CY, CB]
  category: all
  desc: "General-purpose white-noise source with LP/HP filtering and an LP sweep."
  parameters:
  - pos: 1
    key: LPF
    name: "LP Filter"
    desc: "Lowpass cutoff frequency."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 2
    midi_cc: 17
    midi_nrpn: [1, 1]
    bridge_param: lpf
  - pos: 2
    key: LPQ
    name: "LP Resonance"
    desc: "Resonance around the LP cutoff (0 quenches resonance)."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 5
    midi_cc: 20
    midi_nrpn: [1, 4]
    midi_slot_c8_label: "Sweep Time"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 5 'Sweep Time'; on-screen/device param here is LPQ (LP Resonance). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: lpq
  - pos: 3
    key: ATK
    name: "Attack"
    desc: "Attack phase length."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 6
    midi_cc: 21
    midi_nrpn: [1, 5]
    midi_slot_c8_label: "LP Resonance"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 6 'LP Resonance'; on-screen/device param here is ATK (Attack). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: atk
  - pos: 4
    key: DEC
    name: "Decay"
    desc: "Decay phase length."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 3
    midi_cc: 18
    midi_nrpn: [1, 2]
    bridge_param: dec
  - pos: 5
    key: HPF
    name: "HP Filter"
    desc: "Highpass cutoff frequency."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 4
    midi_cc: 19
    midi_nrpn: [1, 3]
    midi_slot_c8_label: "Sweep Depth"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 4 'Sweep Depth'; on-screen/device param here is HPF (HP Filter). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: hpf
  - pos: 6
    key: SWD
    name: "Sweep Depth"
    desc: "Depth of the LP filter sweep (negative or positive)."
    range:
      min: -64
      max: 63
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 8
    midi_cc: 23
    midi_nrpn: [1, 7]
    midi_slot_c8_label: "Attack"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 8 'Attack'; on-screen/device param here is SWD (Sweep Depth). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: swd
  - pos: 7
    key: SWT
    name: "Sweep Time"
    desc: "Length of the sweep from SWD (low = snappy, high = longer)."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 7
    midi_cc: 22
    midi_nrpn: [1, 6]
    midi_slot_c8_label: "HP Frequency"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 7 'HP Frequency'; on-screen/device param here is SWT (Sweep Time). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: swt
  - pos: 8
    key: LEV
    name: "Level"
    desc: "Overall machine volume."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 1
    midi_cc: 16
    midi_nrpn: [1, 0]
    bridge_param: lev

- id: ut-impulse
  name: "UT IMPULSE"
  display: "Positive/Negative Polarity Impulse"
  manual_ref: "APPENDIX D.1 (p.96)"
  tracks: [BD, SD, RS, CP, BT, LT, MT, HT, CH, OH, CY, CB]
  category: all
  desc: "General-purpose single-impulse generator with selectable polarity."
  parameters:
  - pos: 1
    key: ATK
    name: "Attack"
    desc: "Attack phase length."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 2
    midi_cc: 17
    midi_nrpn: [1, 1]
    bridge_param: atk
  - pos: 2
    key: DEC
    name: "Decay"
    desc: "Decay phase length."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 3
    midi_cc: 18
    midi_nrpn: [1, 2]
    bridge_param: dec
  - pos: 3
    key: POL
    name: "Polarity"
    range:
      min: 0
      max: 1
      enum: [POS, NEG]
      note: 0=POS, 1=NEG
      display: "POS, NEG"
      source: manual+daemon
    desc: "Impulse polarity, positive or negative."
    midi_slot: 8
    midi_cc: 23
    midi_nrpn: [1, 7]
    bridge_param: pol
  - pos: 4
    key: LEV
    name: "Level"
    desc: "Overall machine volume."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 1
    midi_cc: 16
    midi_nrpn: [1, 0]
    bridge_param: lev

  # ----- D.2 BASS DRUM — usable on BD, SD, RS, CP tracks ---------------------
- id: bd-hard
  name: "BD HARD"
  display: "Bass Drum — Hard"
  manual_ref: "APPENDIX D.2 (p.97)"
  tracks: [BD, SD, RS, CP]
  category: bass-drum
  desc: "Punchy hard bass drum (the manual's default SRC example, BDHD). Fixed sweep depth; tick + snap transient shaping."
  parameters:
  - pos: 1
    key: TUN
    name: "Tune"
    desc: "Oscillator pitch in semitones."
    range:
      min: -32.0
      max: 32.0
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 2
    midi_cc: 17
    midi_nrpn: [1, 1]
    bridge_param: tun
  - pos: 2
    key: SWT
    name: "Sweep Time"
    desc: "Pitch sweep time (sweep depth is fixed)."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 5
    midi_cc: 20
    midi_nrpn: [1, 4]
    bridge_param: swt
  - pos: 3
    key: SNP
    name: "Snap Amount"
    desc: "Snap transient level."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 6
    midi_cc: 21
    midi_nrpn: [1, 5]
    midi_slot_c8_label: "Sweep Depth"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 6 'Sweep Depth'; on-screen/device param here is SNP (Snap Amount). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: snp
  - pos: 4
    key: DEC
    name: "Decay"
    desc: "Decay phase length."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 3
    midi_cc: 18
    midi_nrpn: [1, 2]
    bridge_param: dec
  - pos: 5
    key: WAV
    name: "Waveform"
    range:
      min: 0
      max: 2
      enum: [sine, asym sine, triangle]
      note: enum index 0..2
      display: "sine, asym sine, triangle"
      source: manual+daemon
    desc: "Oscillator waveform (increasing overtone content)."
    midi_slot: 7
    midi_cc: 22
    midi_nrpn: [1, 6]
    bridge_param: wav
  - pos: 6
    key: HLD
    name: "Hold Time"
    desc: "Hold time before the decay phase."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 4
    midi_cc: 19
    midi_nrpn: [1, 3]
    bridge_param: hld
  - pos: 7
    key: TIC
    name: "Tick Level"
    desc: "Transient tick level."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 8
    midi_cc: 23
    midi_nrpn: [1, 7]
    bridge_param: tic
  - pos: 8
    key: LEV
    name: "Level"
    desc: "Overall machine volume."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 1
    midi_cc: 16
    midi_nrpn: [1, 0]
    bridge_param: lev

- id: bd-classic
  name: "BD CLASSIC"
  display: "Bass Drum — Classic"
  manual_ref: "APPENDIX D.2 (p.97)"
  tracks: [BD, SD, RS, CP]
  category: bass-drum
  desc: "Classic analog bass drum with adjustable sweep depth and a tick/noise transient."
  parameters:
  - pos: 1
    key: TUN
    name: "Tune"
    desc: "Oscillator pitch in semitones."
    range:
      min: -32.0
      max: 32.0
      center: 0
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 2
    midi_cc: 17
    midi_nrpn: [1, 1]
    bridge_param: tun
  - pos: 2
    key: SWT
    name: "Sweep Time"
    desc: "Pitch sweep time (low = short sweep)."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 5
    midi_cc: 20
    midi_nrpn: [1, 4]
    bridge_param: swt
  - pos: 3
    key: SWD
    name: "Sweep Depth"
    desc: "Depth of the pitch sweep."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 6
    midi_cc: 21
    midi_nrpn: [1, 5]
    bridge_param: swd
  - pos: 4
    key: DEC
    name: "Decay"
    desc: "Decay phase length."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 3
    midi_cc: 18
    midi_nrpn: [1, 2]
    bridge_param: dec
  - pos: 5
    key: WAV
    name: "Waveform"
    range:
