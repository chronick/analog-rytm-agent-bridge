      max: 1
      enum: [sine, sinesaw]
      note: enum index 0..1
      display: "sine, sinesaw"
      source: manual
    desc: "Osc 2 waveform (2 options; a leading small square resets both oscillators' phase on trig)."
    midi_slot: 7
    midi_cc: 22
    midi_nrpn: [1, 6]
    bridge_param:
    bridge_settable: false
  - pos: 7
    key: NLEV
    name: "Noise Level"
    desc: "Noise level."
    range:
      min: 0
      max: 127
      display:
      source: daemon:rytm-rs@f2e8143
    midi_slot: 5
    midi_cc: 20
    midi_nrpn: [1, 4]
    midi_slot_c8_label: "Osc 2 Detune"
    midi_slot_note: Appendix C.8 machine_src_midi_order labels synth slot 5 'Osc 2 Detune'; on-screen/device param here is NLEV (Noise Level). Manual C.8 naming diverges from the device (rytm-rs); slot is device truth.
    bridge_param: nlev
  - pos: 8
    key: LEV
    name: "Level"
    range:
      min: 0
      max: 127
      display: "0-127"
      source: manual+daemon
    desc: "Overall machine volume."
    midi_slot: 1
    midi_cc: 16
    midi_nrpn: [1, 0]
    bridge_param: lev

