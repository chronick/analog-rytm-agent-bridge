rytm-rs = { git = "https://github.com/chronick/rytm-rs.git", rev = "4d4f4976d7ccc076ac67a3e54c57012bebf7e886" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
