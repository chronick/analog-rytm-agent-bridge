[package]
name = "analog-rytm-agent-daemon"
version = "0.1.0"
edition = "2021"
# plock_dump (forensic bin) would otherwise make bare `cargo run` ambiguous.
default-run = "analog-rytm-agent-daemon"
# File::try_lock (single-instance state lock) requires 1.89.
rust-version = "1.89"
description = "Rust hardware daemon boundary for the Analog Rytm agent bridge."

[dependencies]
cpal = "0.18.1"
hound = "3.5.1"
midir = "0.11.0"
rytm-rs = { git = "https://github.com/chronick/rytm-rs.git", rev = "f2e8143f4f92f3ba2241dd65753d50f63a906aeb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

# Temporary: use the local rytm-rs fork carrying the p-lock fixes (sentinel fill
# on pool-slot claim + basic single-byte routing for lfo_depth/sample_start/
# sample_end per libanalogrytm pattern.h). Remove this section and repin the
# `rev` above once the fork is pushed.
[patch."https://github.com/chronick/rytm-rs.git"]
rytm-rs = { path = "/Users/chronick-mbp/git/rytm-rs/rytm" }
