[package]
name = "analog-rytm-agent-daemon"
version = "0.1.0"
edition = "2021"
# plock_dump (forensic bin) would otherwise make bare `cargo run` ambiguous.
default-run = "analog-rytm-agent-daemon"
# File::try_lock (single-instance state lock) requires 1.89.
rust-version = "1.89"
description = "Rust hardware daemon boundary for the Analog Rytm agent bridge."

[dependencies]
cpal = "0.18.1"
hound = "3.5.1"
midir = "0.11.0"
# Maintained fork of alisomay/rytm-rs, pinned to an immutable revision so the
# codecs and firmware fixtures a build resolves are exactly the ones certified
# against hardware. The fork carries typed Song/Scene/Performance codecs, the
# round-trip and active-low routing fixes, and the p-lock pool corrections
# (sentinel fill on pool-slot claim, plus basic single-byte routing for
# lfo_depth/sample_start/sample_end per libanalogrytm pattern.h). Offered
# upstream as a pull request; see docs/UPSTREAM.md.
rytm-rs = { git = "https://github.com/algonormative/rytm-rs.git", rev = "5e9c0f120c3a0fa739ffe9a9962996a7738276b0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[dev-dependencies]
# Used by the hardware certification examples in examples/.
anyhow = "1.0"
