[dependencies]
midir = "0.10.3"
rytm-rs = { git = "https://github.com/chronick/rytm-rs.git", rev = "96f3e9c6004d55c07c546b404e05653a036e4e61" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
